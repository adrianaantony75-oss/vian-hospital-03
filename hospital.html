<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>VIAN Hospital 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: engineering viewer. 3D stage fills the left, a parts panel on the right (stacks below on phones). One dark technical look by choice. */
:root{
  color-scheme:dark;
  --bg:#0A0F15; --panel:#0F1620; --card:#141D29; --line:#223042; --fg:#E7EEF5; --muted:#91A2B4; --faint:#5E6F82;
  --accent:#3FD3C2; --blue:#2F7BEF; --amber:#F2B33D; --red:#EE5A5A; --mains:#E2703A; --low:#F2B33D; --data:#4C9BFF; --sensor:#3FD3C2; --tube:#DCE6EE;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.logo{height:15px;width:auto}
.logo path{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:square;stroke-linejoin:miter}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl b{font-size:15px;letter-spacing:.02em}
.ttl span{font-size:12px;color:var(--muted)}
.hdr-r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navlink{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px;border:1px solid var(--line);color:var(--fg);text-decoration:none}
.caption{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(640px,calc(100% - 32px));background:rgba(8,12,18,.88);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.45;text-align:center}
.caption small{display:block;color:var(--faint);font:600 11px var(--mono);margin-bottom:4px}
.tb .play{background:var(--accent);color:#04201c}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid #4a3a17;background:#1d1708;padding:4px 8px;border-radius:99px}

.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(80% 70% at 50% 40%,#16222f,#0A0F15)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:rgba(10,15,21,.85);border:1px solid var(--accent);color:var(--accent);font:600 10.5px var(--mono);display:grid;place-items:center;white-space:nowrap}
.pin.sel{background:var(--accent);color:#04201c}
.pin.hide{display:none}
.toolbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.tb{pointer-events:auto;display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(15,22,32,.92);border:1px solid var(--line);backdrop-filter:blur(8px)}
.tb button{padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tb button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.tb button.on{color:var(--accent)}
.sw{width:18px;height:18px;border-radius:50%;padding:0!important;margin:4px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.hint{position:absolute;top:12px;left:12px;font-size:12px;color:var(--muted);background:rgba(15,22,32,.8);border:1px solid var(--line);padding:6px 10px;border-radius:10px;max-width:calc(100% - 24px)}
.toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-10px);opacity:0;transition:.25s;background:var(--fg);color:#0A0F15;font-weight:700;font-size:13px;padding:9px 14px;border-radius:12px;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.views{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px}
.views button{font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:9px;background:rgba(15,22,32,.9);border:1px solid var(--line);color:var(--muted)}

aside{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
.fcard{border:1px solid var(--line);border-radius:14px;min-height:min-content}
.fcard header{all:unset;display:flex;gap:10px;align-items:center;padding:12px;background:var(--card);border-radius:14px 14px 0 0}
.fcard .stg{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--mono);color:#04201c;background:var(--accent)}
.fcard .sw3{flex:none;width:14px;height:40px;border-radius:4px;border:1px solid var(--line)}
.fcard b{display:block;font-size:14px}
.fcard small{color:var(--muted);font-size:12px}
.fcard p{margin:0;padding:10px 12px 0;color:var(--muted);font-size:12.5px;line-height:1.5}
.fcard .kv{margin:10px 12px 12px}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;font-weight:700;font-size:13px;background:var(--accent);color:#04201c}
.big.off{background:var(--card);color:var(--fg);border:1px solid var(--line)}
ol.steps{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted);font-size:12.5px;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg)}
.pane{flex:1;overflow-y:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
.pane[hidden]{display:none}
.grp h4{margin:4px 0 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.plist{display:grid;gap:2px}
.plist button{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 8px;border-radius:9px;width:100%}
.plist button:hover{background:var(--card)}
.plist button.sel{background:var(--card);box-shadow:inset 2px 0 0 var(--accent)}
.plist code{font:600 10.5px var(--mono);color:var(--faint);min-width:52px}
.plist .sw2{width:8px;height:8px;border-radius:50%;flex:none}
.det h2{margin:2px 0 4px;font-size:20px;font-weight:700;text-wrap:balance}
.det .code{font:600 11px var(--mono);color:var(--accent)}
.det p{margin:0;color:var(--muted);line-height:1.55}
.kv{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:8px 10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45;min-width:0}
.kv div:nth-child(-n+2){border-top:0}
.kv div:nth-child(odd){color:var(--faint);background:var(--card)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.links button:hover{border-color:var(--accent);color:var(--accent)}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.place{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.place b{color:var(--accent)}
.legend{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.flow{display:grid;gap:6px}
.node{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.node b{display:block;font-size:13px}
.node span{font-size:12px;color:var(--muted)}
.arrow{font:600 11px var(--mono);color:var(--accent);padding-left:12px}
pre{margin:0;font:12px/1.5 var(--mono);color:#cfe3ef;background:#081018;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.note{font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--amber);padding-left:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--faint);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-top:0}
.scroll{overflow-x:auto}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto;min-height:100%}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .views{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 80 20" role="img" aria-label="VIAN"><path d="M2 2 L10 18 L18 2 M28 2 V18 M38 18 L46 2 L54 18 M64 18 V2 L78 18 V2"/></svg>
    <div class="ttl"><b>Hospital 03 · Interactive engineering model</b><span>Concept rev A · all dimensions in mm · tap any part</span></div>
    <div class="hdr-r"><a class="navlink" href="index.html">All products</a><a class="navlink" href="home.html">VIAN Home</a><span class="chip">Concept, not validated</span></div>
  </header>

  <section class="stage" id="stage">
    <canvas id="c" aria-label="3D model of the VIAN Hospital 03 air purifier"></canvas>
    <div class="pins" id="pins"></div>
    <div class="hint" id="hint">Drag to rotate · scroll or pinch to zoom · tap a part or a number</div>
    <div class="views" id="views">
      <button data-v="hero">3/4</button><button data-v="front">Front</button><button data-v="right">Right</button><button data-v="rear">Rear</button><button data-v="top">Top</button>
    </div>
    <div class="caption" id="cap" hidden></div>
    <div class="toolbar">
      <div class="tb"><button class="play" id="playBtn">▶ Play explainer</button></div>
      <div class="tb" id="modes">
        <button data-m="solid" aria-pressed="true">Outside</button>
        <button data-m="xray" aria-pressed="false">X-ray</button>
        <button data-m="cut" aria-pressed="false">Cut-away</button>
        <button data-m="explode" aria-pressed="false">Exploded</button>
      </div>
      <div class="tb" id="toggles">
        <button data-t="air" aria-pressed="false">Airflow</button>
        <button data-t="wires" aria-pressed="false">Wiring</button>
        <button data-t="pins" aria-pressed="true">Numbers</button>
      </div>
      <div class="tb" id="acts">
        <button data-a="door">Open door</button>
        <button data-a="filter">Slide filters out</button>
        <button data-a="mode">Mode: Surgery quiet</button>
        <button data-a="fan" class="on">Fan on</button>
      </div>
      <div class="tb" id="fin" aria-label="Finish">
        <button class="sw" data-f="silver" aria-pressed="true" style="background:#D9DDE1" aria-label="Silver-white finish"></button>
        <button class="sw" data-f="ice" aria-pressed="false" style="background:#CFE2EE" aria-label="Ice blue finish"></button>
        <button class="sw" data-f="teal" aria-pressed="false" style="background:#A6D5CA" aria-label="Sea-glass teal finish"></button>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-p="parts">Parts</button>
      <button role="tab" aria-selected="false" data-p="detail">Details</button>
      <button role="tab" aria-selected="false" data-p="filters">Filters</button>
      <button role="tab" aria-selected="false" data-p="app">App link</button>
    </div>
    <div class="pane" id="p-parts"></div>
    <div class="pane det" id="p-detail" hidden></div>
    <div class="pane" id="p-filters" hidden></div>
    <div class="pane" id="p-app" hidden></div>
  </aside>
</div>

ay from the sterile field in front. The vanes act as a finger guard over the fan.", "spec": [["Slope", "Front ≈ 990 mm → rear 1,080 mm"], ["Guard", "Passes IEC test-finger probe"], ["Hub", "Status light ring in the centre"]], "place": "Top of the unit, above the fan.", "links": ["fan", "led_ring"]}, "led_ring": {"name": "Outlet light ring", "group": "exterior", "code": "EX-08", "what": "Ring of light at the outlet centre, visible from above. Same colours as the status bar.", "spec": [["Type", "Addressable RGB ring, 24 LEDs"], ["Night mode", "Dims automatically"]], "place": "Centre of the top outlet.", "links": ["main_board", "w_led"]}, "base": {"name": "Graphite chassis and feet", "group": "exterior", "code": "EX-09", "what": "Steel base that carries the heavy parts low down for stability. Four recessed anti-slip feet. Holds the power compartment.", "spec": [["Height", "0–80 mm"], ["Feet", "4 recessed anti-slip pads (castor option for wards)"], ["Weight target", "≈ 30–35 kg total with filter"]], "place": "Bottom of the unit.", "links": ["power_board", "psu", "power_entry"]}, "power_entry": {"name": "Mains power entry", "group": "exterior", "code": "EX-10", "what": "Recessed socket at the rear, below the filter chamber. Fused, with a power switch and a cable clip so the plug cannot be pulled out by accident.", "spec": [["Socket", "IEC C14 with fuse + EMI filter, 2-pole switch"], ["Supply", "230 V AC, 50 Hz"], ["Cord", "Hospital-grade, with retention clip"]], "place": "Rear, low, recessed.", "links": ["power_board", "w_mains"]}, "port_panel": {"name": "Data port panel", "group": "exterior", "code": "EX-11", "what": "Low-voltage connections, kept separate from mains. Ethernet for hospitals that do not allow Wi-Fi. RS-485 to read room data from the building system. Alarm contact for the nurse station.", "spec": [["Ethernet", "RJ45, 10/100"], ["Building link", "RS-485 Modbus RTU, read-only"], ["Alarm out", "Dry contact relay, 30 V 1 A"], ["Service", "USB-C behind a cover aled duct behind the HEPA that carries cleaned air up to the fan. Holds the downstream pressure tap and the clean-air particle sensor.", "spec": [["Material", "Sealed sheet steel or ABS duct"], ["Taps", "HEPA downstream pressure tap"], ["Sensor", "Downstream PM2.5 (filter leak check)"]], "place": "Rear of the cabinet, from the filter up to the fan.", "links": ["hepa", "fan", "pm_out", "dp_board"]}, "fan": {"name": "EC centrifugal blower", "group": "air", "code": "AP-06", "what": "Backward-curved centrifugal 'plug' fan driven by a brushless EC (electronically commutated) motor with built-in electronics. It pulls air through all three filters and pushes it out of the top. In Auto it changes speed by itself from the air sensors, slowly so the sound never jumps. The app and screen can set modes and a maximum noise limit.", "spec": [["Fan type", "Backward-curved centrifugal plug fan, 7 blades, Ø ≈ 280 mm impeller"], ["Motor", "EC external-rotor brushless motor, 230 V AC in, built-in drive"], ["Speed range", "≈ 600 to 2,800 RPM (revolutions per minute)"], ["Airflow", "≈ 225 to 1,050 m³/h (cubic metres per hour)"], ["Noise (estimate)", "≈ 31 dB(A) silent to ≈ 60 dB(A) boost, at 1 m"], ["Power", "≈ 10 W silent · ≈ 105 W medium · ≈ 330 W boost"], ["Control", "0–10 V speed in, tachometer out, fault relay"], ["Rotation", "One direction, marked by the maker; air in from below, out at the top"], ["Mounting", "Rubber anti-vibration mounts, melamine acoustic foam around the fan"], ["Example", "ebm-papst RadiCal R3G 280 class (confirm fan curve)"]], "place": "Top rear, on anti-vibration mounts.", "links": ["inlet_ring", "top_outlet", "w_fanpower", "w_fanctl"]}, "inlet_ring": {"name": "Fan inlet ring", "group": "air", "code": "AP-07", "what": "Shaped nozzle where air enters the fan. Four small pressure taps in it give the real airflow: airflow = k × √(pressure). This is how the display shows measured m³/h, not a guess.", "spec": [["Method", "Inlet-ring K-factor (from fan maker)"], [ pply.", "spec": [["Protection", "Fuse, surge MOV, inrush NTC, EMI filter"], ["Fan feed", "Safety relay; its coil runs through the door interlock, so opening the door drops the relay in hardware"], ["Monitoring", "Relay contact feedback + 24 V rail monitor to main board"], ["Earth", "Bonding stud to chassis, shell and door"], ["Size", "≈ 200 × 120 mm, 2-layer, 2 oz copper"]], "place": "Isolated power compartment in the base.", "links": ["power_entry", "psu", "fan", "door_switch", "w_mains", "w_fanpower"]}, "psu": {"name": "24 V medical power supply", "group": "electronics", "code": "PWR-01", "what": "Converts mains to safe 24 V for all the electronics. Medical-grade so it can be used near patients.", "spec": [["Output", "24 V DC, 60 W"], ["Rating", "IEC 60601-1, 2 × MOPP"], ["Example", "Mean Well MPM-65-24 class"]], "place": "Power compartment in the base, next to the power board.", "links": ["power_board", "main_board", "w_24v"]}, "antenna": {"name": "Wi-Fi / Bluetooth antenna", "group": "electronics", "code": "RF-01", "what": "Flexible 2.4 GHz antenna inside the plastic visor. A metal shell would block the signal, so the antenna sits behind plastic and connects to the ESP32 with a small coax cable.", "spec": [["Type", "FPC antenna, 2.4 GHz, u.FL connector"], ["Cable", "≈ 100 mm micro-coax"]], "place": "Inside the graphite visor, top left.", "links": ["main_board", "w_antenna"]}, "sensor_pod": {"name": "Room air sensor pod", "group": "sensors", "code": "SN-01", "what": "Measures the room air before it is cleaned: particles, CO₂, temperature, humidity, VOC and NOx. It breathes through its own small louvre on the left side, away from the clean-air outlet, so readings are honest.", "spec": [["Sensor", "Sensirion SEN66 (PM1/2.5/4/10, CO₂, RH, T, VOC, NOx)"], ["Interface", "I²C to main board"], ["Height", "≈ 720 mm (breathing zone, away from floor dust)"], ["Quantity", "1 per unit"], ["Labelling", "Shown as \"VIAN local\". Theatre values come from hospital sensors"]], "p function makeShellTexture(){
  const W=4096,Hh=2048,c=document.createElement("canvas");c.width=W;c.height=Hh;const g=c.getContext("2d");

  const uX=u=>((u%1)+1)%1*W, yY=y=>(1-y/H)*Hh, mmU=mm=>mm/LEN;
  // perforation band (front): Z 95–630, ±170 mm of arc from front centre
  g.fillStyle="#4a5058";
  for(let y=100;y<=626;y+=9)for(let d=-168;d<=168;d+=9){const x=uX(U_FRONT+mmU(d));g.beginPath();g.arc(x,yY(y),2.6,0,7);g.fill()}
  // left-side intake band (added after digital lab: halves intake air speed)
  for(let y=100;y<=626;y+=9)for(let d=-150;d<=150;d+=9){const x=uX(U_LEFT+mmU(d));g.beginPath();g.arc(x,yY(y),2.6,0,7);g.fill()}
  // side sensor louvre (left)
  g.fillStyle="#3a3f45";for(let k=0;k<6;k++){const y=690+k*12;g.fillRect(uX(U_LEFT-mmU(26)),yY(y)-2,mmU(52)*W,4)}
  // graphite visor
  g.fillStyle="#262b31";const vx0=uX(U_FRONT-mmU(150)),vx1=uX(U_FRONT+mmU(150));roundRect(g,vx0,yY(1000),vx1-vx0,yY(860)-yY(1000),26);g.fill();
  // engraved logo
  g.strokeStyle="#7c838b";g.lineWidth=3.2;g.lineCap="square";
  const LOGO=[[[0,1],[.35,0],[.7,1]],[[1,1],[1,0]],[[1.3,0],[1.65,1],[2,0]],[[2.3,0],[2.3,1],[2.95,0],[2.95,1]]], lh=13;
  LOGO.forEach(st=>{g.beginPath();st.forEach(([x,z],i)=>{const px=uX(U_FRONT-mmU((x-1.475)*lh)),py=yY(818+(z-.5)*lh);i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke()});
  // door seam
  g.strokeStyle="#9aa1a9";g.lineWidth=3;
  const sF=uFromZ(DOOR.zf),sR=uFromZ(DOOR.zr);
  [[sR,sF+1],[sR-1,sF]].forEach(([a,b])=>{const x0=a*W,x1=b*W;g.strokeRect(x0,yY(DOOR.y1),x1-x0,yY(DOOR.y0)-yY(DOOR.y1))});

}

  Object.values(REG).forEach(r=>{const keep=FF_IDS.includes(r.id)||r.id==="rails"&&false;r.roots.forEach(o=>{o.visible=on?keep:true})});
  [topOut,ring].forEach(o=>o.visible=!on);
  if(on){wiresG.visible=false;airPts.visible=false;$$('#toggles [data-t="wires"],#toggles [data-t="air"]').forEach(b=>b.setAttribute("aria-pressed","false"));
    camAnim={from:camera.position.clone(),to:new THREE.Vector3(1500,900,1300),ft:controls.target.clone(),tt:new THREE.Vector3(0,420,150),t:0}; toast("Filters only: pre-filter · carbon layer · H13 HEPA (carbon + HEPA = one ₹3,999 pack). Tap one for details")}
  else setView("hero");
  renderFilters();
}
function showTab(t){$$(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.p===t));$$(".pane").forEach(p=>p.hidden=p.id!=="p-"+t)}
$$(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.p));

/* numbered pins */
const PIN_IDS=["display","hepa","prefilter","carbon","fan","main_board","sensor_pod","dp_board","filter_id","pm_out","door_switch","power_board","psu","seal_cam","antenna","top_outlet","power_entry","port_panel","inlet_ring","plenum","handle"];
const pinsEl=$("#pins");
PIN_IDS.forEach((id,i)=>{const b=document.createElement("button");b.className="pin";b.dataset.id=id;b.textContent=i+1;b.title=P[id].name;b.onclick=()=>select(id);pinsEl.appendChild(b)});
const tmpV=new THREE.Vector3(), tmpB=new THREE.Box3();
function updatePins(){
  const r=canvas.getBoundingClientRect();
  $$(".pin").forEach(el=>{
    const id=el.dataset.id, root=REG[id]&&REG[id].roots[0];
    const internal=!["display","top_outlet","power_entry","port_panel","handle"].includes(id);
    const rearOnly=id==="power_entry"||id==="port_panel";
    const show=showPins&&root&&root.visible&&(!internal||mode!=="solid"||ffOn)&&!(rearOnly&&mode==="solid"&&camera.position.z>-100);
    if(!show){el.classList.add("hide");return}
    tmpB.setFromObject(root); tmpB.getCenter(tmpV); tmpV.project(camera);
    if(tmpV.z>1){el.classList.add("hide");return}
    el.classList.remove("hide"); el.style.left=((tmpV.x+1)/2*r.width)+"px"; el.style.top=((1-tmpV.y)/2*r.height)+"px";
  });
}

/* ---------- toast ---------- */
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2600)}

/* ---------- resize + loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<1?50:32;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage); resize();

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let last=performance.now(), simAcc=0;
function loop(now){ tick(now); requestAnimationFrame(loop) }
function tick(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=Math.max(last,now);
  // explode
  explodeT+=(explodeTarget-explodeT)*Math.min(1,dt*5);
  Object.values(REG).forEach(r=>r.roots.forEach(o=>{if(o===hinge||o.parent===wiresG)return;o.position.copy(o.userData.home).addScaledVector(o.userData.explode,explodeT)}));
  wiresG.visible=wiresG.visible; // wires stay in place
  // door + filter
  doorT+=((st.door?1:0)-doorT)*Math.min(1,dt*4); hinge.rotation.y=doorT*1.75;
  hinge.position.copy(hinge.userData.home).addScaledVector(hinge.userData.explode,explodeT);
  filterT+=((st.filterOut?1:0)-filterT)*Math.min(1,dt*3);
  cas.position.x=cas.userData.home.x+filterT*400; cas.position.z=cas.userData.home.z;
  carb.position.x=carb.userData.home.x+filterT*400+explodeT*0;
  ffT+=((ffOn?1:0)-ffT)*Math.min(1,dt*3);
  if(ffT>0.001)FF_IDS.forEach(id=>{const o=REG[id].roots[0],v=FF_OFF[id];o.position.x+=v[0]*ffT;o.position.y+=v[1]*ffT;o.position.z+=v[2]*ffT});
  // sim: Auto mode picks speed from room PM2.5, capped by the noise limit of the current room mode
  const running=st.fan&&!st.door;
  const want=st.pmIn>35?2800:st.pmIn>25?2400:st.pmIn>12?1900:st.pmIn>5?1300:900;
  const tr=running?Math.min(want,MODES[st.mode].cap):0; st.rpm+=(tr-st.rpm)*Math.min(1,dt*0.8);
  st.flow=1050*(st.rpm/2800); st.dp=st.filterOut?0:(268+48)*(st.rpm/2800)*(st.rpm/2800)+(Math.random()-.5);
  st.db=st.rpm>50?60+50*Math.log10(st.rpm/2800):0; st.watts=st.rpm>50?330*Math.pow(st.rpm/2800,3)+8:3;
  simAcc+=dt; if(simAcc>1){simAcc=0; st.pmIn=Math.max(6,st.pmIn+(Math.random()-.5)*1.2); st.pmOut=running&&!st.filterOut?0.2+Math.random()*.2:st.pmIn*0.9; drawDisplay(); if(!$("#p-app").hidden)renderApp()}
  if(!reduce) imp.rotation.y+=st.rpm/60*2*Math.PI*dt*0.08;
  if(Math.random()<dt*0.15) st.pmIn=Math.max(3,Math.min(40,st.pmIn+(Math.random()-.45)*8));
  ring.material.color.setHex(st.door||st.filterOut?0xF2B33D:(running?0x4FA3FF:0x334455));
  // particles
  if(airPts.visible){const sp=st.rpm/2780;for(let i=0;i<PN;i++){const q=parts[i];q.t+=dt*0.14*sp*(.8+((i*37)%10)/25);if(q.t>=1){q.t=0;q.p=Math.floor(Math.random()*48)}
    const pts=paths[q.p],k=Math.min(pts.length-1,Math.floor(q.t*(pts.length-1))),v=pts[k];pp3[i*3]=v.x;pp3[i*3+1]=v.y;pp3[i*3+2]=v.z;const c=q.t<.36?DIRTY:CLEAN;pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b}
    pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}
  // camera anim
  if(camAnim){camAnim.t=Math.min(1,camAnim.t+dt*1.6);const e=1-Math.pow(1-camAnim.t,3);camera.position.lerpVectors(camAnim.from,camAnim.to,e);controls.target.lerpVectors(camAnim.ft,camAnim.tt,e);if(camAnim.t>=1)camAnim=null}
  controls.update(); renderer.render(scene,camera); updatePins();
}

/* explainer tour */
let touring=false,tourI=0,tourTimer=null;
function setTog(t,on){const b=$(`[data-t="${t}"]`);if((b.getAttribute("aria-pressed")==="true")!==on)b.click()}
function tourStep(){const s=DATA.tour[tourI];if(!s){stopTour();return}
  if(ffOn)filterFocus(false);applyMode(s.mode);setTog("air",!!s.air);setTog("wires",!!s.wires);setView(s.view);select(s.sel);
  if(s.act==="door"&&!st.door)$('[data-a="door"]').click();if(!s.act&&st.door)$('[data-a="door"]').click();if(s.tab)showTab(s.tab);
  const c=$("#cap");c.hidden=false;c.innerHTML=`<small>${tourI+1} / ${DATA.tour.length}</small>${esc(s.t)}`;tourI++;tourTimer=setTimeout(tourStep,5200)}
function stopTour(){touring=false;clearTimeout(tourTimer);$("#cap").hidden=true;$("#playBtn").textContent="▶ Play explainer";if(st.door)$('[data-a="door"]').click();applyMode("solid");setTog("air",false);setTog("wires",false);setView("hero")}
$("#playBtn").onclick=()=>{if(touring){stopTour();return}touring=true;tourI=0;$("#playBtn").textContent="■ Stop";tourStep()};
renderParts(); renderApp(); renderFilters(); drawDisplay();
document.fonts&&document.fonts.ready.then(drawDisplay);
select("hepa"); showTab("parts");
requestAnimationFrame(loop);
// Advance the scene by n frames without waiting for the browser (used when the tab is in the background).
function frames(n=90){let t=last;for(let i=0;i<n;i++){t+=1000/60;tick(t)}}
window.VIAN={setView,applyMode,select,st,frames,filterFocus,showTab,toggle:t=>$(`[data-t="${t}"]`).click(),act:a=>$(`[data-a="${a}"]`).click(),
  shot:name=>fetch("/save/"+name,{method:"POST",body:canvas.toDataURL("image/png")}).then(r=>r.text())};
})();
</script>
