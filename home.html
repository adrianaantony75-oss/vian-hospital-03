<title>VIAN Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: 3D stage left, parts panel right (stacks on phones). Single dark technical look, matching VIAN Hospital 03. */
:root{
  color-scheme:dark;
  --bg:#0A0F15; --panel:#0F1620; --card:#141D29; --line:#223042; --fg:#E7EEF5; --muted:#91A2B4; --faint:#5E6F82;
  --accent:#3FD3C2; --amber:#F2B33D; --low:#F2B33D; --data:#4C9BFF; --sensor:#3FD3C2;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.logo{height:15px;width:auto}.logo path{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:square;stroke-linejoin:miter}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}.ttl b{font-size:15px}.ttl span{font-size:12px;color:var(--muted)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid #4a3a17;background:#1d1708;padding:4px 8px;border-radius:99px}
.navlink{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px;border:1px solid var(--line);color:var(--fg);text-decoration:none}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(80% 70% at 50% 40%,#16222f,#0A0F15)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:rgba(10,15,21,.85);border:1px solid var(--accent);color:var(--accent);font:600 10.5px var(--mono);display:grid;place-items:center}
.pin.sel{background:var(--accent);color:#04201c}.pin.hide{display:none}
.toolbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.tb{pointer-events:auto;display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(15,22,32,.92);border:1px solid var(--line)}
.tb button{padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tb button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.tb button.on{color:var(--accent)}
.tb .play{background:var(--accent);color:#04201c}
.sw{width:18px;height:18px;border-radius:50%;padding:0!important;margin:4px;border:2px solid transparent}.sw[aria-pressed="true"]{border-color:var(--fg)}
.views{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px}
.views button{font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:9px;background:rgba(15,22,32,.9);border:1px solid var(--line);color:var(--muted)}
.caption{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(640px,calc(100% - 32px));background:rgba(8,12,18,.88);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.45;text-align:center}
.caption small{display:block;color:var(--faint);font:600 11px var(--mono);margin-bottom:4px}
.toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-10px);opacity:0;transition:.25s;background:var(--fg);color:#0A0F15;font-weight:700;font-size:13px;padding:9px 14px;border-radius:12px;pointer-events:none;max-width:70%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
aside{min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg)}
.pane{flex:1;overflow-y:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
.grp h4{margin:4px 0 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.plist{display:grid;gap:2px}
.plist button{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 8px;border-radius:9px;width:100%}
.plist button:hover{background:var(--card)}.plist button.sel{background:var(--card);box-shadow:inset 2px 0 0 var(--accent)}
.plist code{font:600 10.5px var(--mono);color:var(--faint);min-width:44px}.plist .sw2{width:8px;height:8px;border-radius:50%;flex:none}
.det h2{margin:2px 0 4px;font-size:20px;font-weight:700;text-wrap:balance}.det .code{font:600 11px var(--mono);color:var(--accent)}
.det p{margin:0;color:var(--muted);line-height:1.55}
.kv{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:8px 10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45;min-width:0}
.kv div:nth-child(-n+2){border-top:0}.kv div:nth-child(odd){color:var(--faint);background:var(--card)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.place{display:flex;gap:8px;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.place b{color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--amber);padding-left:10px;margin:0}
pre{margin:0;font:12px/1.5 var(--mono);color:#cfe3ef;background:#081018;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-top:0}
.big{display:inline-flex;justify-content:center;padding:11px 14px;border-radius:12px;font-weight:700;font-size:13px;background:var(--accent);color:#04201c}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto;min-height:100%}aside{border-left:0;border-top:1px solid var(--line)}.pane{overflow:visible}.views{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:60%}.caption{bottom:auto;top:56px}}
</style>

  <header>

  </aside>
</div>

function tourStep(){const s=DATA.tour[tourI];if(!s){stopTour();return}
  applyMode(s.mode);setToggle("air",!!s.air);setToggle("wires",!!s.wires);setView(s.view);select(s.sel);
  if(s.act==="filter"&&!st.filterOut)$('[data-a="filter"]').click();if(!s.act&&st.filterOut)$('[data-a="filter"]').click();
  if(s.tab)showTab(s.tab);
  const c=$("#cap");c.hidden=false;c.innerHTML=`<small>${tourI+1} / ${DATA.tour.length}</small>${esc(s.t)}`;tourI++;tourTimer=setTimeout(tourStep,5200)}
function stopTour(){touring=false;clearTimeout(tourTimer);$("#cap").hidden=true;$("#playBtn").textContent="▶ Play explainer";if(st.filterOut)$('[data-a="filter"]').click();applyMode("solid");setToggle("air",false);setToggle("wires",false);setView("hero")}
$("#playBtn").onclick=()=>{if(touring){stopTour();return}touring=true;tourI=0;$("#playBtn").textContent="■ Stop";tourStep()};

let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2600)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<1?50:32;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let last=performance.now(),acc=0;
function tick(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=Math.max(last,now);
  exT+=(exTarget-exT)*Math.min(1,dt*5);Object.values(REG).forEach(r=>r.roots.forEach(o=>{if(o.parent===wiresG)return;o.position.copy(o.userData.home).addScaledVector(o.userData.ex,exT)}));
  fT+=((st.filterOut?1:0)-fT)*Math.min(1,dt*2.5);{const a=Math.min(1,fT*2),b=Math.max(0,fT*2-1);baseG.rotation.y=a*Math.PI/4;baseG.position.z+=380*b;filterG.position.y+=-14*a;filterG.position.z+=380*b;}
  const run=st.fan&&!st.filterOut;const want=st.pm>35?2600:st.pm>12?1800:st.pm>5?1200:700;st.rpm+=((run?want:0)-st.rpm)*Math.min(1,dt*.8);
  acc+=dt;if(acc>1){acc=0;st.pm=Math.max(2,Math.min(40,st.pm+(Math.random()-.5)*2));st.score=Math.round(Math.max(5,100-st.pm*1.6));drawScreen();if(!$("#p-app").hidden)renderApp()}
  if(!reduce)imp.rotation.y+=st.rpm/60*2*Math.PI*dt*.08;led.material.color.setHex(st.filterOut?0xF2B33D:(st.pm<=12?0x43D18F:0xF0C040));
  if(airPts.visible){const sp=Math.max(.2,st.rpm/1800);for(let i=0;i<PN;i++){const q=parts[i];q.t+=dt*.16*sp;if(q.t>=1){q.t=0;q.p=Math.floor(Math.random()*64)}
    const v=paths[q.p][Math.min(300,Math.floor(q.t*300))];pp3[i*3]=v.x;pp3[i*3+1]=v.y;pp3[i*3+2]=v.z;const c=q.t<.28?DIRTY:CLEAN;pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b}
    pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}
  if(camAnim){camAnim.t=Math.min(1,camAnim.t+dt*1.4);const e=1-Math.pow(1-camAnim.t,3);camera.position.lerpVectors(camAnim.from,camAnim.to,e);controls.target.lerpVectors(camAnim.ft,camAnim.tt,e);if(camAnim.t>=1)camAnim=null}
  controls.update();renderer.render(scene,camera);updatePins()}
function loop(n){tick(n);requestAnimationFrame(loop)}
renderParts();renderApp();drawScreen();document.fonts&&document.fonts.ready.then(drawScreen);select("filter");showTab("parts");requestAnimationFrame(loop);
function frames(n=90){let t=last;for(let i=0;i<n;i++){t+=1000/60;tick(t)}}
window.VIAN={setView,applyMode,select,st,frames,showTab,setToggle,act:a=>$(`[data-a="${a}"]`).click(),
  shot:name=>fetch("/save/"+name,{method:"POST",body:canvas.toDataURL("image/png")}).then(r=>r.text()),
  printParts:()=>({shell:shell,top:top,base:baseG})};
})();
</script>
