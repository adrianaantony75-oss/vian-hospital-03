body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.logo{height:15px}.logo path{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:square;stroke-linejoin:miter}
.ttl b{display:block;font-size:15px}.ttl span{font-size:12px;color:var(--muted)}
.hdr-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.navlink{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px;border:1px solid var(--line);color:var(--fg);text-decoration:none}
.picker{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pk{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;min-width:150px}
.pk b{font-size:14px}.pk span{font-size:11.5px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pk .rec{font:700 10px var(--mono);color:#04201c;background:var(--accent);padding:1px 6px;border-radius:99px;margin-top:3px}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(80% 70% at 50% 40%,#16222f,#0A0F15)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tb{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(15,22,32,.92);border:1px solid var(--line)}
.tb button{padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tb button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.sw{width:18px;height:18px;border-radius:50%;padding:0!important;margin:4px;border:2px solid transparent}.sw[aria-pressed="true"]{border-color:var(--fg)}
.badge{position:absolute;top:12px;left:12px;background:rgba(15,22,32,.88);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted);max-width:calc(100% - 24px)}
aside{min-height:0;overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:16px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
h2{margin:2px 0 4px;font-size:22px;text-wrap:balance}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
p{margin:0;color:var(--muted);line-height:1.55}
.kv{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:8px 10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45;min-width:0}
.kv div:nth-child(-n+2){border-top:0}.kv div:nth-child(odd){color:var(--faint);background:var(--card)}
.score{display:grid;gap:6px}
.score div{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px}
.score i{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.score i b{display:block;height:100%;background:var(--accent);border-radius:9px}
ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:4px;font-size:13px}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--amber);padding-left:10px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:6px;border-top:1px solid var(--line)}th{color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-top:0}

  g.add(new THREE.Mesh(ge,body));
  const noz=new THREE.Mesh(new THREE.BoxGeometry(150,14,90),graphite);noz.position.set(0,1100,180);noz.rotation.x=-Math.PI/7;g.add(noz);
  const sc=screen(180,60,g);sc.position.set(161,860,0);sc.rotation.y=Math.PI/2;
  const lg=litLogo(22,g,true);lg.position.set(161,600,0);lg.rotation.y=Math.PI/2;
  plinth(new THREE.Shape().absellipse(0,0,190,300,0,Math.PI*2),g,60);
  return {g,inP:[[400,300,0],[-400,300,0]],outP:[[0,1700,1900],[80,1650,1800],[-80,1750,1800]]}};
B.ejector=()=>{const g=new THREE.Group();
  g.add(new THREE.Mesh(lathe([[0,70],[205,70],[215,300],[200,800],[170,1000],[0,1000]]),body));
  const ring=new THREE.Mesh(lathe([[150,1090],[205,1100],[215,1170],[200,1260],[165,1270],[150,1200]],96),body);g.add(ring);
  const h=new THREE.Mesh(new THREE.TorusGeometry(152,5,12,96),halo);h.rotation.x=Math.PI/2;h.position.y=1150;g.add(h);
  for(let i=0;i<3;i++){const a=i*Math.PI*2/3;const p=new THREE.Mesh(new THREE.CylinderGeometry(6,6,100,10),graphite);p.position.set(Math.cos(a)*180,1045,Math.sin(a)*180);g.add(p)}
  const top=new THREE.Mesh(new THREE.CircleGeometry(168,64),graphite);top.rotation.x=-Math.PI/2;top.position.y=1001;g.add(top);
  const sc=screen(220,70,g);sc.position.set(0,880,186);sc.rotation.x=.14;
  const lg=litLogo(24,g);lg.position.set(0,780,195);lg.rotation.x=.08;
  plinth(new THREE.Shape().absarc(0,0,230,0,Math.PI*2),g,60);
  return {g,inP:[[0,300,450],[400,300,0],[-400,300,0]],outP:[[0,1950,0],[120,1950,60],[-120,1950,-60]]}};
B.manta=()=>{const g=new THREE.Group();
  const s=new THREE.Shape();s.moveTo(-450,0);s.bezierCurveTo(-450,260,-250,330,0,330);s.bezierCurveTo(250,330,450,260,450,0);s.lineTo(-450,0);
  const ge=new THREE.ExtrudeGeometry(s,{depth:400,bevelEnabled:true,bevelThickness:40,bevelSize:40,bevelSegments:10,curveSegments:48});ge.translate(0,0,-200);
  const m=new THREE.Mesh(ge,body);m.scale.y=1.45;m.position.y=50;g.add(m);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(760,16,30),graphite);lip.position.set(0,85,236);g.add(lip);
  const grille=new THREE.Mesh(new THREE.PlaneGeometry(520,240),perfMat);grille.rotation.x=-Math.PI/2;grille.position.set(0,530,-40);g.add(grille);
  const sc=screen(220,66,g);sc.position.set(0,420,205);sc.rotation.x=-.75;
  const lg=litLogo(22,g);lg.position.set(0,150,242);
  plinth(new THREE.Shape([new THREE.Vector2(-440,-190),new THREE.Vector2(440,-190),new THREE.Vector2(440,190),new THREE.Vector2(-440,190)]),g,50);
  return {g,inP:[[0,1100,-200],[300,1100,0],[-300,1100,0]],outP:[[0,80,1800],[500,80,1500],[-500,80,1500]]}};
B.crown=()=>{const g=new THREE.Group();const H=1000;
  const ge=new THREE.CylinderGeometry(200,225,H-70,72,60);ge.translate(0,(H-70)/2+70,0);
  const p=ge.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const r=Math.hypot(x,z);if(r<5)continue;const a=Math.atan2(z,x);const tw=(y-70)/(H-70)*Math.PI*1.2;
    const flute=1-.055*Math.max(0,Math.cos(8*(a-tw)));const nr=r*flute;const na=a;p.setX(i,nr*Math.cos(na));p.setZ(i,nr*Math.sin(na))}ge.computeVertexNormals();
  g.add(new THREE.Mesh(ge,body));
  const band=new THREE.Mesh(lathe([[0,1000],[202,1000],[204,1080],[185,1100],[0,1100]]),body);g.add(band);
  const vanes=new THREE.Group();for(let i=0;i<12;i++){const v=new THREE.Mesh(new THREE.BoxGeometry(150,4,30),graphite);const a=i/12*Math.PI*2;v.position.set(Math.cos(a)*95,1101,Math.sin(a)*95);v.rotation.y=-a;v.rotation.x=.5;vanes.add(v)}g.add(vanes);
  const sc=screen(210,62,g);sc.position.set(0,1050,205);
  const lg=litLogo(16,g);lg.position.set(0,1015,206);
  plinth(new THREE.Shape().absarc(0,0,240,0,Math.PI*2),g,60);
  return {g,inP:[[0,300,450],[400,300,0],[-400,300,0],[0,300,-450]],outP:[[0,1950,0],[300,1900,200],[-300,1900,-200]]}};
/* person for scale */
const person=new THREE.Group();{const m=new THREE.MeshStandardMaterial({color:0x2a3542,roughness:.9});const b=new THREE.Mesh(new THREE.CapsuleGeometry(170,950,8,24),m);b.position.y=170+475;b.scale.z=.55;person.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(110,24,16),m);h.position.y=1640;person.add(h);person.position.set(-850,0,-200);person.visible=false;scene.add(person)}

/* airflow particles */
const PN=420,pg=new THREE.BufferGeometry(),pa=new Float32Array(PN*3),pc=new Float32Array(PN*3);pg.setAttribute("position",new THREE.BufferAttribute(pa,3));pg.setAttribute("color",new THREE.BufferAttribute(pc,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:14,vertexColors:true,transparent:true,depthWrite:false}));scene.add(pts);
let paths=[],parts=[];const D=new THREE.Color(0xF2A34D),K=new THREE.Color(0x63E6FF);
function makePaths(c){paths=[];for(let k=0;k<40;k++){const a=c.inP[k%c.inP.length],o=c.outP[k%c.outP.length];const j=()=>(Math.random()-.5)*160;
  const cv=new THREE.CatmullRomCurve3([new THREE.Vector3(a[0]+j(),a[1]+j(),a[2]+j()),new THREE.Vector3(a[0]*.4,a[1],a[2]*.4),new THREE.Vector3(j()*.3,620,j()*.3),new THREE.Vector3(j()*.4,1050,j()*.4),new THREE.Vector3(o[0]+j(),o[1]+j()*.5,o[2]+j())]);paths.push(cv.getSpacedPoints(200))}
  parts=Array.from({length:PN},()=>({p:Math.floor(Math.random()*40),t:Math.random()}))}

/* scene switching */
let cur=null,curId=null;
function show(id){if(cur)scene.remove(cur.g);lights.length=0;const c=C.find(x=>x.id===id);cur=B[id]();scene.add(cur.g);curId=id;makePaths(cur);
  $$(".pk").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));renderSheet(c);applyLight();try{history.replaceState(null,"","#"+id)}catch(e){}}
function bar(l,v){return `<div><span>${l}</span><i><b style="width:${v*10}%"></b></i><span>${v}</span></div>`}
function metric(k,v){const base=TUN.tower,box=TUN.box;const fmt={reach:x=>x.toFixed(0)+"%",stagnant:x=>x.toFixed(1)+"%",bed_speed:x=>x.toFixed(2)+" m/s",throw:x=>x.toFixed(1)+" m",short:x=>x.toFixed(1)+"%"}[k];return fmt(v)}
function renderSheet(c){const r=TUN[c.id]||{},b=TUN.tower||{},x=TUN.box||{};
  const rows=[["Room reach (air moving > 0.1 m/s)","reach","higher"],["Stagnant air (< 0.03 m/s)","stagnant","lower"],["Speed at patient zone","bed_speed","0.05–0.25 comfortable"],["Throw (air > 0.5 m/s)","throw","longer"],["Clean air going straight back in","short","lower"]];
  $("#sheet").innerHTML=`<div><div class="lbl">Concept ${C.indexOf(c)+1} of 6${c.rec?" · recommended":""}</div><h2>${esc(c.name)}</h2><p>${esc(c.idea)}</p></div>
  <div class="place" style="display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px"><b style="color:var(--accent)">Aerodynamics: </b>${esc(c.how)}</div>
  <div><div class="lbl" style="margin-bottom:6px">Digital wind tunnel (2D CFD, hospital room 4.8 × 2.8 m)</div>
  ${r.reach!==undefined?`<img src="img/tunnel_${c.id}.png" alt="CFD airflow for ${esc(c.name)}" style="width:100%;border-radius:10px;border:1px solid var(--line)">
  <table><tr><th>Test</th><th>${esc(c.name)}</th><th>Common tower</th><th>Common box</th></tr>${rows.map(([l,k])=>`<tr><td>${l}</td><td class="best">${metric(k,r[k])}</td><td>${metric(k,b[k])}</td><td>${metric(k,x[k])}</td></tr>`).join("")}</table>`:"<p>Simulation running…</p>"}</div>
  <div class="kv"><div>Size</div><div>${esc(c.dims)}</div><div>Filter</div><div>${esc(c.filter)}</div><div>Screen</div><div>${esc(c.screen)}</div><div>Logo</div><div>${esc(c.logo)}</div><div>Inside</div><div>Same engineering as VIAN Hospital 03: EC fan, ₹ 3,999 pack, sensors, app</div></div>
  <div><div class="lbl" style="margin-bottom:6px">Strengths</div><ul>${c.pros.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div><div class="lbl" style="margin-bottom:6px">Risks and answers</div><ul>${c.risks.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <p class="note">Image: brighter = faster air; teal = clean-air outlet; amber = intake; box = patient zone. 2D lattice-Boltzmann CFD, a relative comparison only; air pulled along by jets is mixed, not filtered. A 3D CFD and a real smoke test come next for the chosen shape.</p>`}
$("#picker").innerHTML=C.map((c,i)=>`<button class="pk" data-id="${c.id}" aria-pressed="false"><b>${i+1}. ${esc(c.name)}</b><span>${esc(c.tag)}</span>${c.rec?'<span class="rec">RECOMMENDED</span>':""}</button>`).join("");
$$(".pk").forEach(b=>b.onclick=()=>show(b.dataset.id));

/* toggles */
let spin=true,lightOn=true;
function applyLight(){lights.forEach(l=>l.visible=lightOn)}
$$("#tg button").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);const t=b.dataset.t;
  if(t==="air")pts.visible=on;if(t==="light"){lightOn=on;applyLight()}if(t==="spin")spin=on;if(t==="person")person.visible=on});
$$("#fin button").forEach(b=>b.onclick=()=>{$$("#fin button").forEach(x=>x.setAttribute("aria-pressed",x===b));body.color.setHex(+b.dataset.f);perfMat.color.setHex(+b.dataset.f)});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<1?50:32;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let last=performance.now();
function tick(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=Math.max(last,now);
  if(spin&&!reduce&&cur)cur.g.rotation.y+=dt*.25;
  if(pts.visible){for(let i=0;i<PN;i++){const q=parts[i];q.t+=dt*.18;if(q.t>=1){q.t=0;q.p=Math.floor(Math.random()*40)}const v=paths[q.p][Math.min(200,Math.floor(q.t*200))];
    const ang=cur?cur.g.rotation.y:0,ca=Math.cos(ang),sa=Math.sin(ang);pa[i*3]=v.x*ca+v.z*sa;pa[i*3+1]=v.y;pa[i*3+2]=-v.x*sa+v.z*ca;const c=q.t<.45?D:K;pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b}
    pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}
  const pulse=.85+.15*Math.sin(now/600);lights.forEach(l=>l.children.forEach(ch=>{if(ch.isSprite)ch.material.opacity=.45*pulse}));
  controls.update();renderer.render(scene,camera)}
function loop(n){tick(n);requestAnimationFrame(loop)}
const start=(location.hash||"").slice(1);show(C.some(c=>c.id===start)?start:"ejector");requestAnimationFrame(loop);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(C.some(c=>c.id===h)&&h!==curId)show(h)});
window.VIAN={show,frames:(n=60)=>{let t=last;for(let i=0;i<n;i++){t+=16.7;tick(t)}},shot:n=>fetch("/save/"+n,{method:"POST",body:canvas.toDataURL("image/png")}).then(r=>r.text()),setSpin:v=>{spin=v}};
})();
</script>
