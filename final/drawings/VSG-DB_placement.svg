<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710.0 565.0" font-family="Segoe UI, Arial, sans-serif" font-size="12"><title>VSG-DB placement</title><rect width="710.0" height="565.0" fill="#fff"/><text x="30.0" y="30.0" font-size="16" text-anchor="start" fill="#222" font-weight="700">VSG-DB Display board - 100 x 70 mm</text><text x="30.0" y="50.0" font-size="11" text-anchor="start" fill="#555" font-weight="400">2-layer FR-4, 1.6 mm, black mask · Behind the screen cut-out, front of upper shell; module pushed in from behind, 2 x M2 screws</text><rect x="30.0" y="70.0" width="650.0" height="455.0" rx="6" fill="#2f6e3e" stroke="#111" stroke-width="1.5" /><circle cx="56.0" cy="499.0" r="8.775" fill="#fff" stroke="#999"/><circle cx="654.0" cy="499.0" r="8.775" fill="#fff" stroke="#999"/><circle cx="56.0" cy="96.0" r="8.775" fill="#fff" stroke="#999"/><circle cx="654.0" cy="96.0" r="8.775" fill="#fff" stroke="#999"/><rect x="78.8" y="11.5" width="682.5" height="442.0" rx="2" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="4 3"/><text x="420.0" y="236.5" font-size="12" text-anchor="middle" fill="#fff" font-weight="400">DS1 4.0in display module (plugs on, other side)</text><rect x="173.0" y="-21.0" width="494.0" height="26.0" rx="2" fill="#f1f1f1" stroke="#fff" stroke-width="1" /><text x="420.0" y="-4.0" font-size="12" text-anchor="middle" fill="#111" font-weight="400">J2 module socket 1x14</text><rect x="394.0" y="50.5" width="45.5" height="19.5" rx="2" fill="#333" stroke="#fff" stroke-width="1" /><text x="416.8" y="64.2" font-size="10" text-anchor="middle" fill="#fff" font-weight="400">U3 light sensor</text><rect x="160.0" y="375.5" width="19.5" height="19.5" rx="2" fill="#333" stroke="#fff" stroke-width="1" /><text x="169.8" y="389.2" font-size="10" text-anchor="middle" fill="#fff" font-weight="400">Q1 BL</text><rect x="290.0" y="473.0" width="221.0" height="39.0" rx="2" fill="#f1f1f1" stroke="#fff" stroke-width="1" /><text x="400.5" y="496.5" font-size="12" text-anchor="middle" fill="#111" font-weight="400">J1 to main</text><rect x="615.0" y="473.0" width="65.0" height="39.0" rx="2" fill="#f1f1f1" stroke="#fff" stroke-width="1" /><text x="647.5" y="496.5" font-size="10" text-anchor="middle" fill="#111" font-weight="400">J3 to logo</text><text x="30.0" y="549.0" font-size="11" text-anchor="start" fill="#555" font-weight="400">Scale 6.5 px/mm. Top view. Placement guide for the layout engineer: connectors on the board edges that face their cables.</text></svg>