<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820.0 201.2" font-family="Segoe UI, Arial, sans-serif" font-size="12"><title>VSG-TB placement</title><rect width="820.0" height="201.2" fill="#fff"/><text x="30.0" y="30.0" font-size="16" text-anchor="start" fill="#222" font-weight="700">VSG-TB Touch-icon board - 200 x 24 mm</text><text x="30.0" y="50.0" font-size="11" text-anchor="start" fill="#555" font-weight="400">2-layer FR-4, 0.8 mm, black mask · Under the front strip of the pop-up cap, pads pressed against the 0.8 mm icon windows</text><rect x="30.0" y="70.0" width="760.0" height="91.2" rx="6" fill="#2f6e3e" stroke="#111" stroke-width="1.5" /><circle cx="45.2" cy="115.6" r="4.18" fill="#fff" stroke="#999"/><circle cx="774.8" cy="115.6" r="4.18" fill="#fff" stroke="#999"/><text x="30.0" y="185.2" font-size="11" text-anchor="start" fill="#555" font-weight="400">Scale 3.8 px/mm. Top view. Placement guide for the layout engineer: connectors on the board edges that face their cables.</text></svg>